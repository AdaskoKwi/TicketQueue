spring:
  application:
    name: purchase-service
  datasource:
    url: jdbc:postgresql://localhost:5432/purchase_service
    username: purchase_user
    password: purchase_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: "purchase-service-group"
      properties:
        spring.json.trusted.packages: "pl.kul.purchase_service.model.kafka"
        spring.json.value.default.type: "pl.kul.purchase_service.model.kafka.SlotOfferedEvent"
        spring.json.use.type.headers: false
server:
  port: 8081
